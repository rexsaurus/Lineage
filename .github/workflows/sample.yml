name: Build the sample book
on: [push, pull_request]
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: typst-community/setup-typst@v4
      - name: Install poppler (pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Lineage build tools
        run: make install
      - name: Build the sample project and the example chapter
        run: make sample
      - name: Check the scripts compile
        run: .venv/bin/python -m py_compile plugins/lineage/scripts/*.py plugins/lineage/skills/*/scripts/*.py plugins/factory/skills/factory/scripts/*.py plugins/factory/skills/factory/templates/pipeline/scripts/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the marketplace and both plugins
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate plugins/lineage
          claude plugin validate plugins/factory
      - name: The factory scaffolds a toy domain, and its fixture builds
        run: |
          .venv/bin/python plugins/factory/skills/factory/scripts/scaffold.py \
            plugins/factory/skills/factory/examples/toy-minutes.yaml --out "$RUNNER_TEMP/toy"
          make -C "$RUNNER_TEMP/toy" fixture PY="$PWD/.venv/bin/python"
          test -f "$RUNNER_TEMP/toy/fixture/output/minutes-draft.md"
          # the final build must refuse while a bridge is open and the sign-off gate is closed
          ! (cd "$RUNNER_TEMP/toy/fixture" && PIPELINE_HOME="$RUNNER_TEMP/toy" "$GITHUB_WORKSPACE/.venv/bin/python" ../scripts/pl.py build --final)
      - uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: |
            examples/sample-project/output/book-draft.pdf
            examples/erasthus-burnham/erasthus-burnham.pdf
