<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineage</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
:root{
  --ink:#1C1A17; --ink-2:#4A443C; --ink-3:#7C756A;
  --paper:#F7F3EC; --card:#FFFDF8; --line:#E0D9CC;
  --clay:#C96F4A; --clay-dark:#A8552F; --green:#4F7A54; --amber:#B9872F;
  --serif:Fraunces,Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--clay-dark)}
.hidden{display:none !important}
.top{background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:22px;padding:0 22px;height:62px;position:sticky;top:0;z-index:20}
.brand{display:flex;gap:10px;align-items:center;flex:none}
.brand img{width:32px;height:32px;border-radius:8px}
.brand h1{font-family:var(--serif);font-size:21px;margin:0;font-weight:600;letter-spacing:-.2px}
.tabs{display:flex;gap:0;height:100%;overflow-x:auto;scrollbar-width:none}
.tabs a{all:unset;cursor:pointer;display:flex;align-items:center;padding:0 12px;font-size:13.6px;color:#D9D2C6;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--clay)}
.top .proj{margin-left:auto;font-size:12px;color:#A49C90;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.top .proj code{color:#D9D2C6}
.page{padding:32px 40px 90px;max-width:1180px;margin:0 auto}
.page.wide{max-width:none;padding:20px 24px 24px}
.head{margin-bottom:20px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
h2{font-family:var(--serif);font-size:31px;line-height:1.15;margin:0 0 8px;font-weight:600;letter-spacing:-.5px}
.lede{color:var(--ink-2);font-size:16px;max-width:68ch;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.card h3{margin:0 0 3px;font-size:16px;font-weight:600}
.card p.sub{margin:0 0 14px;color:var(--ink-3);font-size:13.6px}
.author{position:relative}
.author:after{content:"author";position:absolute;top:12px;right:14px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:20px;padding:1px 8px;background:#F3EEE4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--ink-2)}
input[type=text],input[type=password],input[type=search],input[type=email],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:14.3px;color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--clay);outline-offset:1px}
.btn{all:unset;cursor:pointer;background:var(--ink);color:var(--paper);padding:9px 17px;border-radius:9px;font-size:14px;font-weight:500;text-align:center;white-space:nowrap}
.btn:hover{background:#312C26}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#F0EADF}
.btn.go{background:var(--clay)} .btn.go:hover{background:var(--clay-dark)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:7px}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);background:#F3EEE4;white-space:nowrap;display:inline-block}
.pill.ok{color:#2F5A35;border-color:#BFD6C2;background:#EAF3EB}
.pill.warn{color:#8A6418;border-color:#E3D2AB;background:#FBF4E4}
.pill.bad{color:#8E3B2A;border-color:#E6C4B9;background:#FBECE7}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.choice{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--card);cursor:pointer;display:block}
.choice:hover{border-color:#C9BFAE}
.choice[data-on="1"]{border-color:var(--clay);box-shadow:0 0 0 3px rgba(201,111,74,.14)}
.choice h4{margin:0 0 4px;font-size:15px;font-weight:600}
.choice p{margin:0;font-size:13.2px;color:var(--ink-3)}
.choice .thumb{width:100%;aspect-ratio:7/10;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:10px;display:block}
.choice .swatch{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;margin-bottom:9px;display:block;background:#eee}
.voice{font-family:var(--serif);font-size:14.6px;line-height:1.6;color:var(--ink);margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.note{font-size:13.4px;color:var(--ink-2);background:#F3EEE4;border-radius:10px;padding:12px 15px}
.empty{color:var(--ink-3);font-size:14px;padding:18px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;font-size:13.4px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;word-break:break-word}
.kv.mono dd{font-family:var(--mono);font-size:12.4px;word-break:break-all}
.toggle{display:flex;gap:11px;align-items:flex-start;padding:10px 0;font-weight:400}
.toggle input{margin-top:4px;accent-color:var(--clay);width:16px;height:16px;flex:none}
.toggle b{font-weight:600}
.toggle span{display:block;color:var(--ink-3);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th{text-align:left;font-size:11.2px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 9px 8px;white-space:nowrap}
td{padding:9px 9px;border-top:1px solid var(--line);vertical-align:middle}
tr.group td{background:#F3EEE4;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 9px}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;letter-spacing:.3px}
.icon.audio{background:var(--clay)} .icon.video{background:#8A5A3C} .icon.image{background:var(--green)}
.icon.pdf{background:#8E3B2A} .icon.text{background:var(--ink-2)} .icon.other{background:var(--ink-3)}
.links a,.links button{all:unset;cursor:pointer;color:var(--clay-dark);font-size:12.8px;margin-right:10px;text-decoration:underline;text-underline-offset:2px}
.linkish{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}
.linkish:hover{color:var(--clay-dark);text-decoration:underline}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--card);transition:.15s;margin-bottom:16px}
.drop.over{border-color:var(--clay);background:#FBF2EC}
.drop p{margin:3px 0;color:var(--ink-3)}
/* transcribe history */
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
.chatmain{display:flex;flex-direction:column;height:calc(100vh - 62px - 44px);min-height:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sessionbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.sessionbar .who{font-family:var(--serif);font-size:18px;font-weight:600}
.sessionbar code{font-size:12px;color:var(--ink-3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px 0}
.chip{all:unset;cursor:pointer;font-size:12.8px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#F7F2E9;color:var(--ink-2)}
.chip:hover{border-color:var(--clay);color:var(--clay-dark)}
.composer{display:flex;gap:9px;padding:11px 14px 12px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:180px;font-size:14.5px}
.composer .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.termwrap{flex:1;min-height:0;background:var(--ink);padding:10px 4px 6px 12px}
#term{height:100%}
.side{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 62px - 44px);overflow-y:auto}
.side .card{margin:0;padding:16px}
.action{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.action:first-of-type{border-top:0}
.action .name{font-weight:600;font-size:14px}
.action .step{grid-column:1/-1;font-size:12.4px;color:var(--ink-3)}
.mini{grid-column:1/-1;height:4px;background:#EBE4D8;border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--clay);transition:width .3s}
.appr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto}
.appr li{font-size:12.8px;background:#F7F2E9;border-radius:8px;padding:7px 9px}
.appr code{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
/* stories */
.era{position:sticky;top:62px;background:var(--paper);z-index:2;font-family:var(--serif);font-size:19px;font-weight:600;padding:16px 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.story{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.story .mark{width:66px;height:88px;border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:var(--clay)}
.story h4{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.story .meta{color:var(--ink-3);font-size:13px;margin:2px 0 6px}
.story .chipsrow{display:flex;gap:6px;flex-wrap:wrap}
.pages{display:flex;flex-direction:column;gap:16px;align-items:center}
.pages img{max-width:min(760px,100%);box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:3px;background:#fff}
/* familypedia */
.wiki{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.wiki nav{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
.wiki nav ul{list-style:none;margin:0 0 14px;padding:0}
.wiki nav li a{display:block;padding:3px 8px;border-radius:6px;font-size:13.6px;color:var(--ink);text-decoration:none}
.wiki nav li a:hover,.wiki nav li a[aria-current="true"]{background:#EFE7DA}
.wiki nav h5{margin:12px 0 4px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3)}
.article h2{margin-bottom:4px}
.infobox{float:right;width:250px;margin:0 0 14px 20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px}
.infobox .ph{width:100%;aspect-ratio:1;border-radius:8px;background:#EFE7DA;display:grid;place-items:center;font-family:var(--serif);font-size:54px;color:var(--clay);margin-bottom:10px}
.cite{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:#F7F2E9;border-radius:5px;padding:0 5px;margin-left:4px;cursor:pointer;color:var(--clay-dark);text-decoration:none}
.cite:hover{border-color:var(--clay)}
.tier h4{margin:16px 0 4px;font-size:14px}
.quote{font-family:var(--serif);font-size:15.2px;line-height:1.6;margin:6px 0 10px;padding-left:12px;border-left:3px solid var(--line)}
.wl{color:var(--clay-dark);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.mine{border-left:3px solid var(--green);padding-left:10px}
.derived{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(28,26,23,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--paper);z-index:41;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer header,.modal header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer header h3,.modal header h3{font-family:var(--serif);font-size:21px;margin:0;font-weight:600}
.drawer .body{padding:18px 22px;overflow-y:auto}
.ts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.4px}
.ts button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.2px;color:var(--clay-dark);text-decoration:underline}
.ts .spk{color:var(--ink-3);font-size:12px}
.ts .hl{background:#F6DFA8;border-radius:3px}
.modal{position:fixed;inset:4vh 5vw;background:var(--paper);border-radius:16px;z-index:41;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .body{padding:20px 24px;overflow:auto;flex:1}
.preview{background:#FFFDF8;border:1px solid var(--line);border-radius:14px;padding:28px 34px;font-family:var(--serif);font-size:16px;line-height:1.72;white-space:pre-wrap}
.preview mark{background:#F6DFA8;padding:1px 5px;border-radius:3px;font-family:var(--sans);font-size:13.5px}
.tree{list-style:none;padding:0;margin:0}
.tree li{padding:9px 0 9px 20px;border-left:2px solid var(--line);margin-left:9px;position:relative}
.tree li:before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--clay)}
.tree li.told:before{background:#D7C49A} .tree li.witnessed:before{background:var(--green)}
.tree .name{font-weight:600} .tree .meta{color:var(--ink-3);font-size:13px}
@media (max-width:1000px){.work,.wiki{grid-template-columns:1fr}.chatmain,.side{height:auto}.termwrap{height:60vh}.grid.three,.grid.four,.grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:22px 16px 80px}.infobox{float:none;width:auto;margin:0 0 14px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/logo.svg" alt="Lineage"><h1 id="lin-title">Lineage</h1><img id="lin-crest" class="hidden" alt="" style="width:30px;height:30px;border-radius:6px;object-fit:cover"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="proj">project <code id="proj"></code></div>
</header>
<main id="main"></main>
<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
/* ======================================================================================
   LABELS — the only place UI words for the book's pieces live. The engine and files keep
   their names (chapters/, data/chapters.csv); people see "stories". The printed book still
   has chapters, so "chapter" survives only where the book's own structure is meant.
   ====================================================================================== */
const L = {
  story:'story', Story:'Story', stories:'stories', Stories:'Stories',
  storyMap:'Story map', proposeStories:'Propose stories', storyTemplate:'Story template',
  generateRemaining:'Generate the remaining stories', storiesAbout:'Stories about',
  bookChapter:'Chapter', // the printed book's own numbering
  states:{'draft':'draft', 'in the book':'in the book', 'kept aside':'kept aside'},
  templates:{ancestor:'Ancestor story', 'life-stage':'Life stage', theme:'Theme across a life', album:'Photo album'},
  noStories:'No stories yet — add a source to start one.',
};
const TABS = [
  ['settings','Settings'], ['sources','Sources'], ['familypedia','Familypedia'],
  ['transcribe','Transcribe History'], ['read','Read About It'], ['listen','Listen To It'],
  ['connectors','Connectors'], ['family','Family'],
];
const TOKEN = "__LINEAGE_TOKEN__";
const S = {data:null, tab:null, built:{}, results:{}, sources:null, voices:[], stories:null, wiki:null, article:null};
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, {method='GET', body=null}={}){
  const opts = {method, headers:{'X-Lineage-Token':TOKEN}};
  if(body instanceof FormData) opts.body = body;
  else if(body!==null){ opts.body = JSON.stringify(body); opts.headers['Content-Type']='application/json'; }
  return (await fetch(path, opts)).json();
}
const fileUrl = rel => '/api/file?path='+encodeURIComponent(rel)+'&token='+encodeURIComponent(TOKEN);
const settings = () => S.data.state.settings;
async function saveSettings(patch){
  const r = await api('/api/settings',{method:'POST', body:patch});
  S.data.state.settings = r.settings; S.data.state.title = r.title; S.data.state.subject = r.subject;
  if(r.identity){ S.data.identity = r.identity; drawIdentityHeader(); drawStale(); }
  syncMirrors(); return r;
}
/* the lineage's name flows everywhere by reference: header, browser title, Familypedia front page */
function drawIdentityHeader(){
  const id = S.data.identity;
  $('#lin-title').textContent = id.display_title;
  $('#lin-title').title = id.title ? '' : 'Name this lineage in Settings';
  document.title = id.title ? `${id.title} · Lineage` : 'Untitled lineage · Lineage';
  const c=$('#lin-crest'); if(id.crest){ c.src=fileUrl(id.crest)+'&v='+Date.now(); c.classList.remove('hidden'); } else c.classList.add('hidden');
}
function drawStale(){
  const box=$('#id-stale'); if(!box) return;
  const st=S.data.identity.stale||[];
  box.innerHTML = st.length ? `<div class="note" style="margin-top:12px">Out of date since the name or summary changed: ${st.map(x=>`<span class="pill warn">${esc(x)}</span>`).join(' ')} <button class="btn ghost sm" id="id-fresh">I've checked these</button></div>` : '';
  const f=$('#id-fresh'); if(f) f.onclick=async()=>{ S.data.identity = await api('/api/identity/fresh',{method:'POST',body:{}}); drawStale(); };
}
function fmtBytes(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; if(n<1073741824) return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; }
function fmtDur(s){ if(s==null) return '—'; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }
function head(el,{kicker,title,lede}){ el.insertAdjacentHTML('beforeend',`<div class="head"><div class="kicker">${esc(kicker)}</div><h2>${esc(title)}</h2>${lede?`<p class="lede">${esc(lede)}</p>`:''}</div>`); }
function options(list, cur){ return list.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join(''); }
function alertNote(msg){ const n=document.createElement('div'); n.className='note'; n.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:80vw'; n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),4500); }

/* ------------------------------------------------------------------ boot + routing (no wizard: every tab, any time) */
async function boot(){
  S.data = await api('/api/bootstrap');
  $('#proj').textContent = S.data.project;
  drawIdentityHeader();
  if(S.data.demo) document.body.insertAdjacentHTML('afterbegin','<div style="background:#B9872F;color:#fff;text-align:center;font-size:13px;padding:5px">Demo mode (--demo): pipeline results are invented sample content, not your project.</div>');
  $('#tabs').innerHTML = TABS.map(([id,label])=>`<a data-tab="${id}">${esc(label)}</a>`).join('');
  $('#main').innerHTML = TABS.map(([id])=>`<section id="tab-${id}" class="page${id==='transcribe'?' wide':''} hidden"></section>`).join('');
  $$('#tabs a').forEach(a=>a.onclick=()=>{ location.hash = a.dataset.tab; });
  window.addEventListener('hashchange', route);
  if(!location.hash) history.replaceState(null,'','#'+(S.data.state.title||S.data.keys.anthropic ? 'transcribe' : 'settings'));
  route();
}
const BUILDERS = {};
function route(){
  const raw = location.hash.replace('#',''); let [t, ...rest] = raw.split('/');
  t = t.split('-')[0];
  if(!TABS.some(([id])=>id===t)) t='settings';
  S.tab = t;
  $$('#tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.tab===t?'page':'false'));
  TABS.forEach(([x])=>$('#tab-'+x).classList.toggle('hidden', x!==t));
  const always = ['sources','connectors','family','read','listen'];
  if(!S.built[t] || always.includes(t)){ BUILDERS[t]($('#tab-'+t), rest); S.built[t]=true; }
  else { syncMirrors(); if(t==='familypedia' && rest.length) openArticle(decodeURIComponent(rest[0])); }
  if(t==='transcribe') onTermShown();
  if(t==='connectors' && raw.includes('drive-failed')) alertNote('Google sign-in did not complete.');
}
function syncMirrors(){
  $$('[data-setting]').forEach(el=>{ const v = settings()[el.dataset.setting];
    if(el.tagName==='SELECT' && ![...el.options].some(o=>o.value===String(v??''))) return;
    if(el.type==='checkbox') el.checked = !!v; else if(document.activeElement!==el) el.value = v ?? ''; });
  $$('[data-choice-for]').forEach(c=>{ c.dataset.on = settings()[c.dataset.choiceFor]===c.dataset.id ? 1 : 0; });
}
function bindSettingInputs(root){
  $$('[data-setting]', root).forEach(el=>{ el.onchange = ()=>saveSettings({[el.dataset.setting]: el.type==='checkbox' ? el.checked : el.value}); });
}
async function runJob(stage, onStep, onDone, onError){
  const r = await api('/api/run/'+stage,{method:'POST'});
  if(!r.job){ onError && onError(r.error||'could not start'); return; }
  return pollJob(r.job, onStep, onDone, onError);
}
function pollJob(job, onStep, onDone, onError){
  return new Promise(resolve=>{ const t=setInterval(async()=>{ const j=await api('/api/job/'+job);
    onStep && onStep(j.step, j.progress);
    if(j.state==='done'){ clearInterval(t); onDone && onDone(j.result); resolve(j.result); }
    if(j.state==='error'||j.state==='unknown'){ clearInterval(t); onError && onError(j.step||'job lost'); resolve(null); } }, 350); });
}

const STAGE_LABEL={ingest:'Saved', extract:'Reading', understand:'Understanding', index:'Indexed', drive:'Drive'};
function stageLine(x){
  const order=['ingest','extract','understand','index'];
  const st=x.stages||{};
  if(!x.rid) return `<span class="pill">not ingested</span> <button class="btn sm" data-scan="${esc(x.id)}">Ingest</button>`;
  const failed=order.find(k=>st[k]&&st[k].state==='failed');
  if(failed) return `<span class="pill bad" title="${esc(st[failed].detail)}">${STAGE_LABEL[failed]} failed</span> <button class="btn sm" data-rescan="${esc(x.rid)}">Retry</button><br><span style="font-size:12px;color:#8E3B2A">${esc(st[failed].detail)}</span>`;
  const chips = order.map(k=>{ const v=st[k]; const cls=!v?'':(v.state==='done'?'ok':(v.state==='running'?'warn':''));
    return `<span class="pill ${cls}" style="padding:2px 7px">${v&&v.state==='running'?STAGE_LABEL[k]+'…':STAGE_LABEL[k]}</span>`; }).join('');
  const notes=[];
  if(st.extract&&st.extract.detail&&/can't read|not installed|no text layer/.test(st.extract.detail)) notes.push(st.extract.detail);
  if(st.understand&&/no Anthropic key/.test(st.understand.detail)) notes.push('Basic summary only: add an Anthropic key in Connectors, then Re-ingest.');
  return `<div class="row" style="gap:3px">${chips}</div>${notes.map(n=>`<div style="font-size:12px;color:#8A6418;margin-top:3px">${esc(n)}</div>`).join('')}`;

function openMenu(btn, x){
  closeMenu();

    ...(x.drive_url?[['Open in Drive', ()=>window.open(x.drive_url,'_blank','noopener')]]:[]),
    ...(x.transcribed?[['Transcript', ()=>openTranscript(x.id)]]:[]),
    ['Rename', ()=>editSource(x.id, 'name')],
    ['Edit details', ()=>editSource(x.id)],
    [x.rid?'Re-ingest':'Ingest', async()=>{ await api('/api/engine/source/scan',{method:'POST',body:x.rid?{rid:x.rid}:{path:x.id}}); alertNote(x.rid?'Re-ingesting. Your edits are kept.':'Ingesting.'); loadSources(); }],
    ...(x.transcription==='queued'?[['Transcribe', async()=>{ const r=await api('/api/engine/source/transcribe',{method:'POST',body:{rid:x.rid}}); alertNote(r.error||'Transcription started. It runs once per file.'); loadSources(); }]]:[]),
    ...(x.rid?[['Delete…', ()=>confirmDelete([x.rid])]]:[]),
  ];
  const m=document.createElement('div'); m.id='row-menu';
  m.style.cssText='position:absolute;right:0;top:34px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:5px;min-width:170px';
  m.innerHTML=items.map(([l],i)=>`<button data-mi="${i}" style="all:unset;display:block;cursor:pointer;padding:7px 11px;border-radius:7px;font-size:13.5px;width:calc(100% - 22px)${l.startsWith('Delete')?';color:#8E3B2A':''}">${esc(l)}</button>`).join('');
  btn.parentElement.appendChild(m);
  $$('[data-mi]', m).forEach(b=>{ b.onmouseenter=()=>b.style.background='#F0EADF'; b.onmouseleave=()=>b.style.background=''; b.onclick=e=>{ e.stopPropagation(); closeMenu(); items[+b.dataset.mi][1](); }; });
  setTimeout(()=>document.addEventListener('click', closeMenu, {once:true}), 0);
}

async function confirmDelete(rids){

  const cited=r.items.filter(i=>i.stories.length), drive=r.items.filter(i=>i.in_drive);
  openModal(rids.length>1?`Delete ${rids.length} sources?`:`Delete ${(r.items[0]||{}).name||'this source'}?`, `
    <p>The original${rids.length>1?'s move':' moves'} to <code>.trash/</code> in the project with ${rids.length>1?'their':'its'} details, and leave${rids.length>1?'':'s'} the index. You can restore from Trash.</p>
    ${cited.length?`<div class="note" style="margin-bottom:12px"><b>Cited:</b> ${cited.map(i=>`${esc(i.name)} is cited in ${i.stories.length} ${i.stories.length>1?L.stories:L.story} (${i.stories.map(s=>esc(s.title)).join(', ')})`).join('; ')}. Those ${L.stories} will be marked stale, not left with broken citations.</div>`:''}
    ${drive.length?`<label class="toggle"><input type="checkbox" id="del-drive"><div><b>Also delete the Google Drive cop${drive.length>1?'ies':'y'} (${drive.length})</b><span>Off by default: deleting here leaves Drive alone.</span></div></label>
      <label class="toggle hidden" id="del-drive-confirm-row"><input type="checkbox" id="del-drive-confirm"><div><b>Yes, delete from Drive too</b><span>This removes the Drive file for everyone who can see the folder.</span></div></label>`:''}
    <div class="row" style="margin-top:14px"><button class="btn go" id="del-go">${rids.length>1?`Delete ${rids.length} sources`:'Delete'}</button><button class="btn ghost" id="del-cancel">Cancel</button></div>`);
  const dd=$('#del-drive'); if(dd) dd.onchange=()=>$('#del-drive-confirm-row').classList.toggle('hidden', !dd.checked);
  $('#del-cancel').onclick=closeOverlay;
  $('#del-go').onclick=async()=>{
    const delDrive = !!(dd && dd.checked && $('#del-drive-confirm').checked);
    if(dd && dd.checked && !delDrive){ alertNote('Tick "Yes, delete from Drive too" to confirm, or untick the Drive option.'); return; }
    await api('/api/engine/source/bulk',{method:'POST',body:{action:'delete', rids, delete_drive:delDrive}});
    closeOverlay(); S.sel.clear(); loadSources();
    undoToast(`${rids.length>1?rids.length+' sources':'Source'} moved to .trash${delDrive?' (Drive copies deleted)':' (Drive untouched)'}.`, async()=>{
      for(const rid of rids) await api('/api/engine/source/trash',{method:'POST',body:{rid, restore:true}}); loadSources(); alertNote('Restored.'); });
  };
}
function undoToast(msg, undo){

  n.innerHTML=`<span>${esc(msg)}</span><button class="btn sm">Undo</button>`;
  n.querySelector('button').onclick=()=>{ n.remove(); undo(); };
  document.body.appendChild(n); setTimeout(()=>n.remove(), 12000);
}

async function openTranscript(id, atSeconds=null){
  const d=await api('/api/engine/source?id='+encodeURIComponent(id));
  const media = d.kind==='audio'||d.kind==='video';
  openDrawer(id.split('/').pop(), d.transcribed ? `
    ${media?`<audio id="dr-audio" controls preload="metadata" src="${fileUrl(id)}" style="width:100%;margin-bottom:14px"></audio>`:''}
    <h4 style="margin:0 0 6px">Session ${esc(d.session)}</h4>
    <dl class="kv" style="margin-bottom:18px">${Object.entries(d.header).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${d.topics.length?`<h4 style="margin:0 0 6px">Topics</h4><div class="ts" style="margin-bottom:18px">${d.topics.map(t=>`<button data-t="${t.t}">${t.t}</button><span>${esc(t.title)}</span>`).join('')}</div>`:''}
    <h4 style="margin:0 0 6px">Jump to</h4>
    <div class="ts">${d.paragraphs.map(p=>`<button data-s="${p.seconds}">${p.t}</button><span class="${atSeconds===p.seconds?'hl':''}" ${atSeconds===p.seconds?'id="dr-hit"':''}><span class="spk">${esc(p.speaker)}</span> ${esc(p.text)}</span>`).join('')}</div>`
    : '<p>Not transcribed yet.</p>');
  const jump=sec=>{ const a=$('#dr-audio'); if(!a){ alertNote('Jumping needs the recording itself; this source is text.'); return; } a.currentTime=sec; a.play(); };
  $$('.drawer [data-s]').forEach(b=>b.onclick=()=>jump(+b.dataset.s));
  $$('.drawer [data-t]').forEach(b=>b.onclick=()=>{ const [h,m,s]=b.dataset.t.split(':').map(Number); jump(h*3600+m*60+s); });
  const hit=$('#dr-hit'); if(hit) hit.scrollIntoView({block:'center'});
}
/* open the transcript at a citation like "[S1 00:00:05]" */
async function openCitation(cite){
  const m = /\[?(S\d+) (\d\d):(\d\d):(\d\d)/.exec(cite||''); if(!m){ alertNote('No transcript line for this citation.'); return; }
  if(!S.sources){ const r=await api('/api/engine/sources'); S.sources=r.sources; }
  const src = S.sources.find(x=>x.session===m[1]);
  const secs = (+m[2])*3600+(+m[3])*60+(+m[4]);
  if(src) openTranscript(src.id, secs);
  else alertNote(`Session ${m[1]} has no recording in sources/ yet.`);
}

function initTerminal(){

  const t = new Terminal({fontFamily:"'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace", fontSize:13.2, lineHeight:1.18, cursorBlink:true, scrollback:10000,
    theme:{background:'#1C1A17', foreground:'#F7F3EC', cursor:'#C96F4A', cursorAccent:'#1C1A17', selectionBackground:'#5B544A',
      black:'#1C1A17', red:'#E07A5F', green:'#9DBF8F', yellow:'#E3B95F', blue:'#8FB3D9', magenta:'#C99BC9', cyan:'#86C5C0', white:'#E9E2D6',

function flushKeys(){ const d=TERM.buf; TERM.buf=''; TERM.timer=null; if(d) TERM.chain = TERM.chain.then(()=>api('/api/term/input',{method:'POST',body:{data:d}})); }
let resizeTimer=null;
function sendResize(){ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ if(TERM.term) api('/api/term/resize',{method:'POST',body:{cols:TERM.term.cols, rows:TERM.term.rows}}); },120); }
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function openStream(){
  if(TERM.es) TERM.es.close();
  const es = new EventSource('/api/term/stream?token='+encodeURIComponent(TOKEN)); TERM.es = es;
  es.addEventListener('hello', e=>{ const d=JSON.parse(e.data); TERM.term.reset(); if(d.scrollback) TERM.term.write(b64(d.scrollback)); setTermStatus(d); });
  es.addEventListener('data', e=>TERM.term.write(b64(e.data)));
  es.addEventListener('status', e=>setTermStatus(JSON.parse(e.data)));
  es.addEventListener('clear', ()=>TERM.term.clear());
}
function setTermStatus(d){
  S.data.terminal = d; const p=$('#t-status'); if(!p) return;
  const map={running:['ok','running'], exited:['warn','exited'], 'not configured':['bad','not configured'], 'not started':['','not started']};
  const [cls,label]=map[d.status]||['',d.status];
  p.className='pill '+cls; p.textContent=label; p.title=d.detail||'';
  $('#t-cmd').textContent = d.command ? `${d.command} · ${d.cwd||''}` : '';
  if(d.status==='not configured' && d.detail && TERM.term) TERM.term.write(`\r\n\x1b[33m${d.detail}\x1b[0m\r\n`);
}
async function startTerminal(){ const d = await api('/api/term/start',{method:'POST'}); setTermStatus(d); setTimeout(()=>{ TERM.fit && TERM.fit.fit(); sendResize(); },60); }
function onTermShown(){
  setTimeout(()=>{ try{ TERM.fit && TERM.fit.fit(); sendResize(); }catch(e){} TERM.term && TERM.term.focus(); }, 30);
  if(!TERM.started){ TERM.started=true; if(S.data.terminal.status!=='running') startTerminal(); }
}
async function sendToTerminal(text){
  if(!text.trim()) return;
  if(S.data.terminal.status!=='running'){ await startTerminal(); await new Promise(r=>setTimeout(r,900)); }
  // Multi-line text goes in as a bracketed paste so it stays one message (agent CLIs support
  // it); a single line is typed plainly, which every shell understands. Return submits it.
  const body = text.includes('\n') ? '\x1b[200~'+text+'\x1b[201~' : text;
  TERM.chain = TERM.chain.then(()=>api('/api/term/input',{method:'POST',body:{data:body}}))
                         .then(()=>new Promise(r=>setTimeout(r,60)))
                         .then(()=>api('/api/term/input',{method:'POST',body:{data:'\r'}}));
  TERM.term && TERM.term.focus();
}

function drawStories(){

  if(br) list=list.filter(s=>s.bridges>0);
  const sorters={chrono:(a,b)=>(a.year??1e9)-(b.year??1e9), book:(a,b)=>(+a.id)-(+b.id), recent:(a,b)=>(b.mtime||0)-(a.mtime||0), longest:(a,b)=>b.words-a.words};
  list.sort(sorters[order]);

  let era=null, html='';

    const e = order==='chrono' ? eraOf(s.year) : null;
    if(e && e!==era){ html+=`<div class="era">${esc(e)}</div>`; era=e; }
    html+=`<div class="story"><div class="mark">${esc((s.title||'?')[0])}</div>
      <div><h4>${esc(s.title)}</h4><div class="meta">${esc(s.dates||'undated')}${s.summary?' · '+esc(s.summary):''}</div>
        <div class="chipsrow">${s.exists?`<span class="pill">${s.words.toLocaleString()} words</span><span class="pill">${s.reading_minutes} min read</span>`:'<span class="pill warn">no draft yet</span>'}
        ${s.stale?`<span class="pill bad" title="${esc(s.stale.reason)}">stale</span>`:''}${s.photos?`<span class="pill">${s.photos} photo${s.photos!==1?'s':''}</span>`:''}${s.bridges?`<span class="pill warn">${s.bridges} bridge${s.bridges!==1?'s':''} to approve</span>`:''}
        <span class="pill ${s.state==='in the book'?'ok':''}">${esc(s.state==='in the book'?s.book_position.replace('Chapter',L.bookChapter):L.states[s.state])}</span></div></div>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
        ${s.exists?`<button class="btn sm" data-read="${esc(s.id)}">Read</button>`:''}
        <button class="btn ghost sm" disabled title="Narration arrives with the ElevenLabs build (ROADMAP item 9)">Listen</button>
        <select data-state="${esc(s.id)}" style="padding:5px 8px;font-size:12.5px">${Object.entries(L.states).map(([v,l])=>`<option value="${esc(v)}" ${s.state===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div></div>`;
  });
  $('#rd-list').innerHTML = `<div class="card" style="padding:4px 22px">${html}</div>`;
  $$('[data-read]').forEach(b=>b.onclick=()=>{ location.hash='read/'+encodeURIComponent(b.dataset.read); });
  $$('[data-state]').forEach(sel=>sel.onchange=async()=>{ await api('/api/engine/story/state',{method:'POST',body:{id:sel.dataset.state, state:sel.value}}); const r=await api('/api/engine/stories'); S.stories=r.stories; drawStories(); });
}
async function readStory(id){
  if(!S.stories){ const r=await api('/api/engine/stories'); S.stories=r.stories; }
  const order = S.stories.slice().sort((a,b)=>(a.year??1e9)-(b.year??1e9)).filter(s=>s.exists);
  const i = order.findIndex(s=>s.id===String(id)); const s = order[i];
  if(!s){ alertNote('This story has no draft yet.'); return; }
  openModal(s.title, `<div class="row" style="margin-bottom:14px"><span class="pill">${esc(s.dates||'undated')}</span><span class="pill">${s.words.toLocaleString()} words</span>
      <span class="pill">${s.citations} cited paragraph${s.citations!==1?'s':''}</span>${s.bridges?`<span class="pill warn">${s.bridges} bridge${s.bridges!==1?'s':''}</span>`:''}
      <span class="pill ${s.state==='in the book'?'ok':''}">${esc(s.book_position)}</span><span class="spacer"></span>
      ${i>0?`<button class="btn ghost sm" data-nav="${esc(order[i-1].id)}">← ${esc(order[i-1].title)}</button>`:''}
      ${i<order.length-1?`<button class="btn ghost sm" data-nav="${esc(order[i+1].id)}">${esc(order[i+1].title)} →</button>`:''}</div>
    <div class="pages" id="rd-pages"><p class="empty">Setting the pages…</p></div>`);
  $$('[data-nav]').forEach(b=>b.onclick=()=>readStory(b.dataset.nav));
  const r = await api('/api/engine/story/render',{method:'POST',body:{id:s.id}});
  pollJob(r.job, null, res=>{ $('#rd-pages').innerHTML = res.pages.map(p=>`<img src="${fileUrl(p)}&v=${Date.now()}" alt="page">`).join(''); },
    err=>{ $('#rd-pages').innerHTML=`<div class="note">Couldn't set this ${L.story} as pages: ${esc(err)}</div>`; });
}

/* ================================================================== LISTEN TO IT */
BUILDERS.listen = async function(el){
  el.innerHTML='';
  head(el,{kicker:'Listen To It', title:'The book, read aloud', lede:`Episodes are made from ${L.stories}, in the voice you choose.`});
  el.insertAdjacentHTML('beforeend', `<div class="grid two"><div class="card"><h3>Voice</h3><p class="sub" id="voice-sub">Loading voices…</p>
      <div class="row"><div style="flex:1;min-width:220px"><select id="voice"></select></div><button class="btn ghost" id="voice-play">Preview</button><audio id="voice-audio"></audio></div></div>
    <div class="card"><h3>Episode</h3><p class="sub">Length and what goes in it.</p>
      <div class="row"><select data-setting="episode_length" style="flex:1"><option>Short — one ${L.story}, 8–12 min</option><option>Standard — two ${L.stories}, 20–25 min</option><option>Long — a part of the book, 40 min</option></select>
      <button class="btn go" id="ep-gen">Generate</button></div><p class="sub" id="ep-step" style="margin:8px 0 0"></p></div></div>
    <div class="card"><h3>Episodes</h3><div id="ep-list"><p class="empty">Loading…</p></div></div>`);
  bindSettingInputs(el); syncMirrors();
  loadVoices();
  $('#ep-gen').onclick=()=>{ $('#ep-gen').disabled=true; runJob('podcast', s=>{$('#ep-step').textContent=s;}, r=>{ $('#ep-gen').disabled=false; $('#ep-step').textContent=r.note; loadEpisodes(); }, e=>{ $('#ep-gen').disabled=false; $('#ep-step').textContent=e; }); };
  loadEpisodes();
};
async function loadEpisodes(){
  const r = await api('/api/engine/episodes');
  $('#ep-list').innerHTML = r.episodes.length ? r.episodes.map(e=>`<div class="story" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)"><div><h4>${esc(e.name)}</h4>
      <div class="meta">${e.kind==='audio'?'audio':'script'} · ${fmtBytes(e.bytes)}</div>
      ${e.kind==='audio'?`<audio controls src="${fileUrl(e.id)}" style="width:100%"></audio>`:'<span class="pill warn">audio not rendered yet</span>'}
      <p><a href="${fileUrl(e.id)}" download>Download</a></p></div>
      ${e.text?`<div class="preview" style="max-height:260px;overflow:auto;font-size:14.4px;padding:16px 20px">${esc(e.text)}</div>`:'<div></div>'}</div>`).join('')
    : `<p class="empty">No episodes yet. Generate one from a ${L.story} above.</p>`;
}
async function loadVoices(){
  const r = await api('/api/voices'); S.voices=r.voices; const s=settings();
  $('#voice-sub').textContent = r.live ? 'Live from your ElevenLabs account.' : (r.voices.length ? 'Demo voices.' : 'No voices yet. Add an ElevenLabs key in Connectors to choose one and hear previews.');
  $('#voice').innerHTML = r.voices.map(v=>`<option value="${esc(v.voice_id)}" ${s.voice_id===v.voice_id?'selected':''}>${esc(v.name)}</option>`).join('');
  $('#voice').onchange=e=>saveSettings({voice_id:e.target.value, voice_name:e.target.selectedOptions[0].textContent});
  $('#voice-play').onclick=()=>{ const v=S.voices.find(x=>x.voice_id===$('#voice').value);
    if(!v||!v.preview_url){ alertNote(r.live?'This voice has no preview sample.':'Previews need an ElevenLabs key.'); return; }
    const a=$('#voice-audio'); a.src=v.preview_url; a.play(); };
}

/* ================================================================== CONNECTORS */
/* author-only surface: keys, OAuth, agent CLIs. */
BUILDERS.connectors = async function(el){
  el.innerHTML='';
  head(el,{kicker:'Connectors', title:'Services and tools', lede:"Keys are checked against the real service and stored in ~/.lineage/config.json (chmod 600) on this machine. If a card isn't wired up, it says so."});
  el.insertAdjacentHTML('beforeend','<div class="grid three" id="conn"><div class="card">Loading…</div></div>');
  const c = await api('/api/connectors');
  const keyCard=(id)=>{ const P=S.data.providers[id], m=c.keys[id];
    return `<div class="card author"><h3>${esc(P.label)}</h3><p class="sub">Used for: ${esc(P.use)}</p>
      <div class="row" style="margin-bottom:8px"><span class="pill ${m?'ok':''}" id="pill-${id}">${m?'saved · '+esc(m):'not connected'}</span></div>
      <input type="password" id="in-${id}" placeholder="${m?'replace the key':'paste a key'}">
      <div class="row" style="margin-top:10px"><button class="btn sm" data-connect="${id}">${m?'Replace':'Connect'}</button>
      ${m?`<button class="btn ghost sm" data-recheck="${id}">Check again</button><button class="btn ghost sm" data-disconnect="${id}">Disconnect</button>`:''}</div></div>`; };
  const d=c.drive;
  $('#conn').innerHTML = `
    <div class="card author"><h3>Google Drive</h3><p class="sub">Used for: source and output sync, the shared family folder. Token stored in ~/.lineage/, never in the project.</p>
      <div class="row" style="margin-bottom:10px"><span class="pill ${d.connected?'ok':''}">${d.connected?(d.can_read_folder?'connected · can read the folder':'connected · device flow (files Lineage created only)'):'not connected'}</span></div>
      <details ${d.client_configured?'':'open'}><summary style="cursor:pointer;font-size:13px;color:var(--ink-2)">OAuth client ${d.client_configured?'(saved)':'— needed first'}</summary>
        <p class="sub" style="margin:8px 0">Create a <b>Desktop app</b> OAuth client in Google Cloud Console (APIs &amp; Services → Credentials) with the Drive API enabled, then paste it here.</p>
        <input type="text" id="g-id" placeholder="client ID"><div style="height:8px"></div><input type="password" id="g-secret" placeholder="client secret">
        <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="g-save">Save client</button></div></details>
      <div class="row" style="margin-top:12px"><button class="btn sm" id="g-device" ${d.client_configured?'':'disabled'}>Connect (device code)</button>
        <button class="btn ghost sm" id="g-browser" ${d.client_configured?'':'disabled'}>Browser sign-in</button>${d.connected?'<button class="btn ghost sm" id="g-disc">Disconnect</button>':''}</div>
      <div id="g-out" class="note" style="margin-top:10px;display:none"></div>
      <p class="sub" style="margin:10px 0 0;font-size:12.4px">Device code only sees files Lineage itself created: fine for uploading outputs, not for reading an existing folder. Browser sign-in can read the folder.</p></div>
    <div class="card author"><h3>GitHub</h3><p class="sub">Used for: the book repo.</p>
      <div class="row" style="margin-bottom:8px"><span class="pill ${c.gh.logged_in?'ok':(c.gh.installed?'warn':'')}">${c.gh.installed?(c.gh.logged_in?'gh CLI · '+esc(c.gh.account||'signed in'):'gh CLI found, not signed in'):'gh CLI not found'}</span>
      <span class="pill ${c.keys.github?'ok':''}" id="pill-github">${c.keys.github?'token · '+esc(c.keys.github):'no token'}</span></div>
      <input type="password" id="in-github" placeholder="a fine-grained token (optional if gh is signed in)">
      <div class="row" style="margin-top:10px"><button class="btn sm" data-connect="github">${c.keys.github?'Replace':'Save token'}</button>${c.keys.github?'<button class="btn ghost sm" data-disconnect="github">Disconnect</button>':''}
        <button class="btn ghost sm" id="gh-push">Push the book repo</button></div>
      <p class="sub" style="margin:10px 0 0;font-size:12.4px">Push runs <code>git push origin HEAD</code> in the project with your existing git credentials.</p></div>
    ${keyCard('anthropic')}${keyCard('openai')}${keyCard('elevenlabs')}
    <div class="card author" style="grid-column:span 2"><h3>Detected on this machine</h3><p class="sub">Agent CLIs on PATH. The one you pick runs in Transcribe History.</p>
      ${c.clis.length?c.clis.map(x=>`<label class="toggle" style="padding:6px 0"><input type="radio" name="cli" value="${esc(x.command)}" ${c.terminal_command===x.command?'checked':''}><div><b>${esc(x.label)}</b> <span class="pill">${x.kind}</span><span>${esc(x.path)}</span></div></label>`).join(''):'<p class="sub">No agent CLI found on PATH.</p>'}</div>
    <div class="card"><h3>Grok</h3><p class="sub">xAI</p><span class="pill">not wired up</span><p class="sub" style="margin-top:10px">Nothing calls Grok yet. A placeholder, not a connection.</p></div>
    <div class="card"><h3>ChatGPT</h3><p class="sub">OpenAI's app</p><span class="pill">not wired up</span><p class="sub" style="margin-top:10px">Not connected to anything. The OpenAI key above (illustrations) is real; this card is not.</p></div>`;
  $$('[data-connect]', el).forEach(b=>b.onclick=()=>connectKey(b.dataset.connect));
  $$('[data-disconnect]', el).forEach(b=>b.onclick=async()=>{ await api('/api/key',{method:'POST',body:{provider:b.dataset.disconnect, remove:true}}); S.data.keys[b.dataset.disconnect]=''; BUILDERS.connectors(el); });
  $$('[data-recheck]', el).forEach(b=>b.onclick=async()=>{ const p=$('#pill-'+b.dataset.recheck); p.className='pill'; p.textContent='checking…';
    const r=await api('/api/key/recheck',{method:'POST',body:{provider:b.dataset.recheck}}); p.className='pill '+(r.ok===true?'ok':(r.ok===null?'warn':'bad')); p.textContent=r.detail; });
  $$('input[name=cli]', el).forEach(r=>r.onchange=()=>{ saveSettings({terminal_command:r.value}); alertNote(`The terminal will run ${r.value}. Press Restart in Transcribe History.`); });
  $('#g-save').onclick=async()=>{ await api('/api/google/client',{method:'POST',body:{client_id:$('#g-id').value, client_secret:$('#g-secret').value}}); BUILDERS.connectors(el); };
  $('#g-device').onclick=googleDevice;
  $('#g-browser').onclick=async()=>{ const r=await api('/api/google/browser-url'); if(r.ok) location.href=r.url; else alertNote(r.detail); };
  const gd=$('#g-disc'); if(gd) gd.onclick=async()=>{ await api('/api/google/disconnect',{method:'POST'}); BUILDERS.connectors(el); };
  $('#gh-push').onclick=async()=>{ $('#gh-push').textContent='pushing…'; const r=await api('/api/repo/push',{method:'POST'}); $('#gh-push').textContent='Push the book repo'; alertNote(r.detail); };
};
async function connectKey(provider){
  const input=$('#in-'+provider), pill=$('#pill-'+provider); pill.className='pill'; pill.textContent='checking…';
  const r=await api('/api/key',{method:'POST',body:{provider, key:input.value}});
  pill.className='pill '+(r.ok===true?'ok':(r.ok===null?'warn':'bad')); pill.textContent = r.ok===true ? (r.detail+' · '+r.masked) : r.detail;
  if(r.ok!==false){ S.data.keys[provider]=r.masked; input.value=''; }
}
async function googleDevice(){
  const out=$('#g-out'); out.style.display='block'; out.textContent='asking Google…';
  const r=await api('/api/google/device/start',{method:'POST'}); if(!r.ok){ out.textContent=r.detail; return; }
  out.innerHTML=`Go to <a href="${esc(r.verification_url)}" target="_blank" rel="noopener">${esc(r.verification_url)}</a> and enter <b style="font-family:var(--mono);font-size:16px">${esc(r.user_code)}</b>. Waiting…`;
  const t=setInterval(async()=>{ const p=await api('/api/google/device/poll',{method:'POST'});
    if(p.state==='connected'){ clearInterval(t); alertNote('Google Drive connected.'); BUILDERS.connectors($('#tab-connectors')); }
    else if(!['authorization_pending','slow_down','pending'].includes(p.state)){ clearInterval(t); out.textContent='Stopped: '+p.state; } }, (r.interval||5)*1000);
}

/* ================================================================== FAMILY (owner-only management) */
BUILDERS.family = async function(el){
  el.innerHTML='';
  head(el,{kicker:'Family', title:'Who can add to the book', lede:"Relatives add material without ever seeing this dashboard. You're the only owner; nothing a relative sends reaches the book until you've reviewed it."});
  el.insertAdjacentHTML('beforeend', `<div class="note" style="margin-bottom:16px">Invite links only work once the project is hosted. Until then a link is for testing on this computer: the server checks it, and it expires and can be revoked.</div>
    <div class="card"><h3>Add someone</h3><div class="grid four" style="margin-top:10px">
      <div><label>Name</label><input type="text" id="fm-name" placeholder="Aunt May"></div>
      <div><label>Relationship</label><input type="text" id="fm-rel" placeholder="her younger sister"></div>
      <div><label>Email</label><input type="email" id="fm-email" placeholder="may@example.org"></div>
      <div><label>Role</label><select id="fm-role"><option value="contributor">Contributor — adds sources and notes</option><option value="reader">Reader — sees the book and Familypedia</option><option value="editor">Editor — annotates and tags anyone's sources</option></select></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="fm-add">Add</button></div></div>
    <div class="card"><h3>Family members</h3><div id="fm-table"><p class="empty">Loading…</p></div></div>
    <div class="card"><h3>Review queue</h3><p class="sub">New contributions from others land here first: the file, its summary and suggested name. Accept, or ask a question.</p><div id="fm-queue"></div></div>`);
  $('#fm-add').onclick=async()=>{ const r=await api('/api/family/member',{method:'POST',body:{name:$('#fm-name').value, relationship:$('#fm-rel').value, email:$('#fm-email').value, role:$('#fm-role').value}});
    if(r.error){ alertNote(r.error); return; } ['fm-name','fm-rel','fm-email'].forEach(i=>$('#'+i).value=''); drawFamily(r); };
  drawFamily(await api('/api/family'));
};
function drawFamily(d){
  $('#fm-table').innerHTML = d.members.length ? `<table><thead><tr><th>Name</th><th>Relationship</th><th>Email</th><th>Role</th><th>Status</th><th>Added</th><th style="text-align:right">Contributed</th><th>Invite</th></tr></thead><tbody>
    ${d.members.map(m=>`<tr><td><strong>${esc(m.name)}</strong></td><td>${esc(m.relationship)}</td><td>${esc(m.email)}</td>
      <td><select data-role="${m.id}" style="padding:4px 8px;font-size:12.5px">${d.roles.map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select></td>
      <td><select data-status="${m.id}" style="padding:4px 8px;font-size:12.5px">${['invited','active','paused'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td style="white-space:nowrap">${esc(m.added.slice(0,10))}</td><td class="num">${m.contributions}</td>
      <td class="links">${m.invite?`<button data-copy="${esc(m.invite.url)}">copy link</button>${m.email?`<a href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Help with the family book')}&body=${encodeURIComponent('Add what you have here: '+m.invite.url)}">email</a>`:''}<button data-revoke="${m.id}">revoke</button><br><span style="font-size:11.5px;color:var(--ink-3)">expires ${esc(m.invite.expires.slice(0,10))}</span>`:`<button data-invite="${m.id}">make invite link</button>`}</td></tr>`).join('')}
    </tbody></table>` : '<p class="empty">No one yet. Add a relative above.</p>';
  $('#fm-queue').innerHTML = d.review_queue.length ? '' : '<p class="empty">Nothing waiting. Contributions appear here once relatives can add material (when the project is hosted).</p>';
  $$('[data-invite]').forEach(b=>b.onclick=async()=>drawFamily(await api('/api/family/invite',{method:'POST',body:{member:b.dataset.invite}})));
  $$('[data-revoke]').forEach(b=>b.onclick=async()=>drawFamily(await api('/api/family/revoke',{method:'POST',body:{member:b.dataset.revoke}})));
  $$('[data-copy]').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); alertNote('Link copied.'); }catch(e){ prompt('Copy the link:', b.dataset.copy); } });
  $$('[data-role]').forEach(s=>s.onchange=async()=>drawFamily(await api('/api/family/member',{method:'POST',body:{id:s.dataset.role, role:s.value}})));
  $$('[data-status]').forEach(s=>s.onchange=async()=>drawFamily(await api('/api/family/member',{method:'POST',body:{id:s.dataset.status, status:s.value}})));
}

/* ================================================================== overlays */
function closeOverlay(){ $('#overlay').innerHTML=''; if(/^#read\/./.test(location.hash)) history.replaceState(null,'','#read'); }
function openDrawer(title, html){
  $('#overlay').innerHTML=`<div class="scrim"></div><aside class="drawer"><header><h3>${esc(title)}</h3><span class="spacer"></span><button class="btn ghost sm" id="ov-close">Close</button></header><div class="body">${html}</div></aside>`;
  $('.scrim').onclick=closeOverlay; $('#ov-close').onclick=closeOverlay;
}
function openModal(title, html){
  $('#overlay').innerHTML=`<div class="scrim"></div><div class="modal"><header><h3>${esc(title)}</h3><span class="spacer"></span><button class="btn ghost sm" id="ov-close">Close</button></header><div class="body">${html}</div></div>`;
  $('.scrim').onclick=closeOverlay; $('#ov-close').onclick=closeOverlay;
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#overlay').innerHTML) closeOverlay(); });

boot();
