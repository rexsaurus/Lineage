<svg xmlns="http://www.w3.org/2000/svg" width="760" height="658" viewBox="0 0 760 658" font-family="Georgia, serif">
<rect width="760" height="658" fill="#F7F3EC"/>
<text x="30" y="34" font-size="20" fill="#1C1A17">The Calders of the Lake</text>
<line x1="130" y1="50" x2="130" y2="648" stroke="#C96F4A" stroke-width="2"/>
<text x="118" y="75" font-size="13" text-anchor="end" fill="#4A443C">about 1883</text>
<circle cx="130" cy="70" r="6" fill="#FFFDF8" stroke="#1C1A17" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="146" y="75" font-size="14" fill="#1C1A17">Anders Calder born near Aalesund, Norway</text>
<text x="118" y="121" font-size="13" text-anchor="end" fill="#4A443C">May 21, 1900</text>
<circle cx="130" cy="116" r="6" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="121" font-size="14" fill="#1C1A17">Anders Calder crosses from Liverpool to Quebec on the S.S. Ottavia</text>
<text x="118" y="167" font-size="13" text-anchor="end" fill="#4A443C">about 1900</text>
<circle cx="130" cy="162" r="6" fill="#FFFDF8" stroke="#1C1A17" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="146" y="167" font-size="14" fill="#1C1A17">Anders works on the ore boats at Duluth (family account)</text>
<text x="118" y="213" font-size="13" text-anchor="end" fill="#4A443C">1910</text>
<circle cx="130" cy="208" r="6" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="213" font-size="14" fill="#1C1A17">Henrik Calder born in Duluth</text>
<text x="118" y="259" font-size="13" text-anchor="end" fill="#4A443C">1938</text>
<circle cx="130" cy="254" r="6" fill="#4F7A54" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="259" font-size="14" fill="#1C1A17">Ruth Calder born in Duluth</text>
<text x="118" y="305" font-size="13" text-anchor="end" fill="#4A443C">October 1938</text>
<circle cx="130" cy="300" r="6" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="305" font-size="14" fill="#1C1A17">Anders and Henrik on the payroll of the Duluth Ore Dock Company</text>
<text x="118" y="351" font-size="13" text-anchor="end" fill="#4A443C">September 3, 1944</text>
<circle cx="130" cy="346" r="6" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="351" font-size="14" fill="#1C1A17">Henrik writes to Ruth from France with the Arrowhead Engineer Battalion</text>
<text x="118" y="397" font-size="13" text-anchor="end" fill="#4A443C">about 1945</text>
<circle cx="130" cy="392" r="6" fill="#4F7A54" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="397" font-size="14" fill="#1C1A17">Ruth walks her father&#x27;s lunch to the ore dock</text>
<text x="118" y="443" font-size="13" text-anchor="end" fill="#4A443C">November 1950</text>
<circle cx="130" cy="438" r="6" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="443" font-size="14" fill="#1C1A17">The big snow; school closed for a week</text>
<text x="118" y="489" font-size="13" text-anchor="end" fill="#4A443C">1951</text>
<circle cx="130" cy="484" r="6" fill="#FFFDF8" stroke="#1C1A17" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="146" y="489" font-size="14" fill="#1C1A17">Anders Calder dies in Duluth</text>
<text x="118" y="535" font-size="13" text-anchor="end" fill="#4A443C">1956–1959</text>
<circle cx="130" cy="530" r="6" fill="#4F7A54" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="535" font-size="14" fill="#1C1A17">Ruth trains as a nurse in Minneapolis</text>
<text x="118" y="581" font-size="13" text-anchor="end" fill="#4A443C">1959</text>
<circle cx="130" cy="576" r="6" fill="#4F7A54" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="581" font-size="14" fill="#1C1A17">Ruth meets Walt at a church dance</text>
<text x="118" y="627" font-size="13" text-anchor="end" fill="#4A443C">1964–1968</text>
<circle cx="130" cy="622" r="6" fill="#4F7A54" stroke="#1C1A17" stroke-width="1.5"/>
<text x="146" y="627" font-size="14" fill="#1C1A17">Ruth and Walt build the cabin on Pike Lake</text>
</svg>